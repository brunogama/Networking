name: Advanced Testing Suite

on:
  push:
    branches: [ main, develop, epic/mvp ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run mutation tests nightly at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: '6.0'
  XCODE_VERSION: '16.1'

jobs:
  # Property-Based Testing with SwiftCheck
  property-based-tests:
    name: Property-Based Testing
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
        
    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-swift-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swift-
          
    - name: Add SwiftCheck dependency
      run: |
        # Add SwiftCheck for property-based testing
        if ! grep -q "SwiftCheck" Package.swift; then
          sed -i '' '/dependencies: \[/a\
        .package(url: "https://github.com/typelift/SwiftCheck.git", from: "0.12.0"),
          ' Package.swift
          
          # Add to test target dependencies
          sed -i '' '/\.testTarget(/,/\]/s/dependencies: \[/dependencies: [\
            "SwiftCheck",/' Package.swift
        fi
        
    - name: Build for testing
      run: swift build --build-tests
      
    - name: Run property-based tests
      run: |
        swift test --filter PropertyTests --parallel
        
    - name: Generate property test report
      run: |
        mkdir -p test-results
        swift test --filter PropertyTests --parallel --enable-test-discovery 2>&1 | tee test-results/property-tests.log
        
    - name: Upload property test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: property-test-results
        path: test-results/

  # BDD Testing with Quick/Nimble
  bdd-tests:
    name: BDD Testing
    runs-on: macos-14
    timeout-minutes: 25
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
        
    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-swift-bdd-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swift-bdd-
          ${{ runner.os }}-swift-
          
    - name: Add BDD testing dependencies
      run: |
        # Add Quick and Nimble for BDD testing
        if ! grep -q "Quick" Package.swift; then
          sed -i '' '/dependencies: \[/a\
        .package(url: "https://github.com/Quick/Quick.git", from: "7.4.0"),\
        .package(url: "https://github.com/Quick/Nimble.git", from: "13.0.0"),
          ' Package.swift
          
          # Add to test target dependencies
          sed -i '' '/\.testTarget(/,/\]/s/dependencies: \[/dependencies: [\
            "Quick", "Nimble",/' Package.swift
        fi
        
    - name: Build for BDD testing
      run: swift build --build-tests
      
    - name: Run BDD tests
      run: |
        swift test --filter BDDTests --parallel
        
    - name: Generate BDD test report
      run: |
        mkdir -p test-results
        swift test --filter BDDTests --parallel --enable-test-discovery 2>&1 | tee test-results/bdd-tests.log
        
    - name: Upload BDD test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bdd-test-results
        path: test-results/

  # Mutation Testing with Muter
  mutation-testing:
    name: Mutation Testing
    runs-on: macos-14
    timeout-minutes: 60
    # Only run on push to main or scheduled runs to avoid excessive CI time
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
        
    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-swift-mutation-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swift-mutation-
          ${{ runner.os }}-swift-
          
    - name: Install Muter
      run: |
        # Install Muter from GitHub releases
        curl -L https://github.com/muter-mutation-testing/muter/releases/latest/download/muter-macos.zip -o muter.zip
        unzip muter.zip
        chmod +x muter
        sudo mv muter /usr/local/bin/
        muter version
        
    - name: Create Muter configuration
      run: |
        cat > muter.conf.json << 'EOF'
        {
          "executable": "/usr/bin/swift",
          "arguments": ["test", "--parallel"],
          "excludeList": [
            "Tests/**/*",
            "Samples/**/*",
            "*.playground/**/*",
            "**/Generated/**/*"
          ],
          "mutationScore": {
            "threshold": 80
          },
          "reportOptions": {
            "format": "json"
          }
        }
        EOF
        
    - name: Build project
      run: swift build --build-tests
      
    - name: Run mutation testing
      id: mutation-test
      continue-on-error: true
      run: |
        mkdir -p test-results
        muter --output-json test-results/mutation-report.json
        
    - name: Parse mutation test results
      run: |
        if [ -f test-results/mutation-report.json ]; then
          echo "## Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "$(cat test-results/mutation-report.json | jq -r '.summary')" >> $GITHUB_STEP_SUMMARY
          
          # Extract mutation score
          MUTATION_SCORE=$(cat test-results/mutation-report.json | jq -r '.mutationScore // 0')
          echo "mutation_score=$MUTATION_SCORE" >> $GITHUB_ENV
          
          if (( $(echo "$MUTATION_SCORE < 80" | bc -l) )); then
            echo "::warning::Mutation score ($MUTATION_SCORE%) is below threshold (80%)"
          else
            echo "::notice::Mutation score ($MUTATION_SCORE%) meets threshold"
          fi
        else
          echo "::error::Mutation testing failed to generate report"
        fi
        
    - name: Upload mutation test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mutation-test-results
        path: test-results/

  # Test Quality Metrics
  test-quality-analysis:
    name: Test Quality Analysis
    runs-on: macos-14
    timeout-minutes: 20
    needs: [property-based-tests, bdd-tests]
    if: always()
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
        
    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        path: all-test-results
        
    - name: Install analysis tools
      run: |
        # Install xcov for coverage analysis
        gem install xcov
        
        # Install periphery for dead code detection in tests
        brew install peripheryapp/periphery/periphery
        
    - name: Run test coverage analysis
      run: |
        swift test --enable-code-coverage
        
        # Generate coverage report
        xcov --scheme "Networking-Package" \
             --workspace . \
             --output_directory coverage-report \
             --json_report
             
    - name: Analyze test code quality
      run: |
        mkdir -p analysis-results
        
        # Detect unused test code
        periphery scan --format json > analysis-results/dead-code.json
        
        # Count test methods and assertions
        find Tests -name "*.swift" -exec grep -l "func test" {} \; | wc -l > analysis-results/test-method-count.txt
        find Tests -name "*.swift" -exec grep -c "XCTAssert\|#expect" {} \; | awk '{sum+=$1} END {print sum}' > analysis-results/assertion-count.txt
        
    - name: Generate comprehensive test report
      run: |
        cat > analysis-results/test-quality-report.md << 'EOF'
        # Test Quality Report
        
        ## Coverage Metrics
        - **Line Coverage:** $([ -f coverage-report/coverage.json ] && jq -r '.coverage.line_coverage' coverage-report/coverage.json || echo "N/A")%
        - **Function Coverage:** $([ -f coverage-report/coverage.json ] && jq -r '.coverage.function_coverage' coverage-report/coverage.json || echo "N/A")%
        
        ## Test Metrics
        - **Total Test Methods:** $(cat analysis-results/test-method-count.txt)
        - **Total Assertions:** $(cat analysis-results/assertion-count.txt)
        - **Property-Based Tests:** Available in artifacts
        - **BDD Tests:** Available in artifacts
        - **Mutation Score:** ${mutation_score:-"Not run"}%
        
        ## Code Quality
        - **Unused Test Code:** $([ -f analysis-results/dead-code.json ] && jq -r 'length' analysis-results/dead-code.json || echo "0") issues found
        
        ## Recommendations
        - Maintain >80% mutation score for robust test suite
        - Add property-based tests for complex algorithms
        - Use BDD tests for user-facing behavior
        - Regular cleanup of unused test code
        EOF
        
    - name: Upload comprehensive analysis
      uses: actions/upload-artifact@v4
      with:
        name: test-quality-analysis
        path: |
          analysis-results/
          coverage-report/

  # Performance Testing
  performance-tests:
    name: Performance Testing
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
        
    - name: Build for performance testing
      run: swift build -c release
      
    - name: Run performance tests
      run: |
        swift test --filter PerformanceTests -c release --parallel
        
    - name: Benchmark key operations
      run: |
        mkdir -p benchmark-results
        
        # Create simple benchmark script
        cat > benchmark.swift << 'EOF'
        import Foundation
        import Networking
        
        func benchmarkNetworkOperations() {
            let iterations = 10000
            let startTime = CFAbsoluteTimeGetCurrent()
            
            for _ in 0..<iterations {
                let request = HTTPRequest(method: .get, url: URL(string: "https://example.com")!)
                // Simulate request processing without actual network calls
                _ = request.headers["Content-Type"]
            }
            
            let timeElapsed = CFAbsoluteTimeGetCurrent() - startTime
            print("Request creation: \(timeElapsed / Double(iterations) * 1_000_000) μs per operation")
        }
        
        benchmarkNetworkOperations()
        EOF
        
        swift benchmark.swift > benchmark-results/performance.log
        
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: benchmark-results/

  # Final report aggregation
  aggregate-results:
    name: Aggregate Test Results
    runs-on: ubuntu-latest
    needs: [property-based-tests, bdd-tests, mutation-testing, test-quality-analysis, performance-tests]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create comprehensive report
      run: |
        echo "# Comprehensive Testing Report" > TESTING_REPORT.md
        echo "" >> TESTING_REPORT.md
        echo "## Test Results Summary" >> TESTING_REPORT.md
        echo "- **Property-Based Tests:** ${{ needs.property-based-tests.result }}" >> TESTING_REPORT.md
        echo "- **BDD Tests:** ${{ needs.bdd-tests.result }}" >> TESTING_REPORT.md
        echo "- **Mutation Testing:** ${{ needs.mutation-testing.result }}" >> TESTING_REPORT.md
        echo "- **Performance Tests:** ${{ needs.performance-tests.result }}" >> TESTING_REPORT.md
        echo "" >> TESTING_REPORT.md
        
        # Add artifacts information
        echo "## Available Artifacts" >> TESTING_REPORT.md
        find . -name "*.log" -o -name "*.json" -o -name "*.md" | head -20 >> TESTING_REPORT.md
        
    - name: Upload final report
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-testing-report
        path: TESTING_REPORT.md