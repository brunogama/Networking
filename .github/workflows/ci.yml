name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Workspace
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test NetworkingMacros
        run: swift test --package-path Packages/NetworkingMacros

      - name: Test Networking
        run: swift test --package-path Packages/Networking

      - name: Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Workspace build: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- NetworkingMacros tests: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Networking tests: PASS" >> $GITHUB_STEP_SUMMARY
