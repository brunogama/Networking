name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.package }})
    runs-on: macos-14
    strategy:
      fail-fast: true
      matrix:
        package:
          - MacroTemplateKit
          - NetworkingMacros
          - Networking
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ matrix.package }}-${{ hashFiles('Packages/${{ matrix.package }}/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.package }}-
            ${{ runner.os }}-spm-

      - name: Build Package
        run: |
          echo "Building ${{ matrix.package }}..."
          swift build --package-path Packages/${{ matrix.package }} -Xswiftc -warnings-as-errors

      - name: Check for Tests
        id: check-tests
        run: |
          if [ -d "Packages/${{ matrix.package }}/Tests" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          echo "Running tests for ${{ matrix.package }}..."
          swift test --package-path Packages/${{ matrix.package }}

      - name: Summary
        run: |
          echo "## Build Results: ${{ matrix.package }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build successful" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-tests.outputs.has_tests }}" == "true" ]; then
            echo "✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No tests found" >> $GITHUB_STEP_SUMMARY
          fi
