name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macros:
    name: Build NetworkingMacros
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            Packages/NetworkingMacros/.build
            ~/.swiftpm
          key: ${{ runner.os }}-spm-macros-${{ hashFiles('Packages/NetworkingMacros/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-macros-

      - name: Build NetworkingMacros
        run: swift build --package-path Packages/NetworkingMacros -Xswiftc -warnings-as-errors

      - name: Test NetworkingMacros
        run: swift test --package-path Packages/NetworkingMacros

  build-networking:
    name: Build Networking
    runs-on: macos-14
    needs: build-macros
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            Packages/Networking/.build
            ~/.swiftpm
          key: ${{ runner.os }}-spm-networking-${{ hashFiles('Packages/Networking/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-networking-

      - name: Build Networking
        run: swift build --package-path Packages/Networking -Xswiftc -warnings-as-errors

      - name: Test Networking
        run: swift test --package-path Packages/Networking

      - name: Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- NetworkingMacros: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Networking: PASS" >> $GITHUB_STEP_SUMMARY
