name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macros:
    name: Build NetworkingMacros
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          source .swift-style.env
          developer_dir="/Applications/Xcode_${XCODE_APPLICATION_VERSION}.app/Contents/Developer"
          test -d "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          swift --version
          xcodebuild -version

      - name: Resolve Dependencies
        working-directory: Packages/NetworkingMacros
        run: swift package resolve

      - name: Clean Build
        working-directory: Packages/NetworkingMacros
        run: rm -rf .build

      - name: Build NetworkingMacros
        working-directory: Packages/NetworkingMacros
        run: swift build -j 1 -Xswiftc -warnings-as-errors

      - name: Test NetworkingMacros
        working-directory: Packages/NetworkingMacros
        run: swift test -j 1

  build-networking:
    name: Build Networking
    runs-on: macos-latest
    needs: build-macros
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          source .swift-style.env
          developer_dir="/Applications/Xcode_${XCODE_APPLICATION_VERSION}.app/Contents/Developer"
          test -d "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          swift --version

      - name: Resolve Dependencies
        working-directory: Packages/Networking
        run: swift package resolve

      - name: Clean Build
        working-directory: Packages/Networking
        run: rm -rf .build

      - name: Build Networking
        working-directory: Packages/Networking
        run: swift build -j 1 -Xswiftc -warnings-as-errors

      - name: Test Networking
        working-directory: Packages/Networking
        run: swift test -j 1

      - name: Test root package consumer
        run: swift test --package-path Fixtures/NetworkingConsumer -j 1

      - name: Test macro extension consumer
        run: swift test --package-path Fixtures/ExtensionConsumer -j 1

      - name: Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- NetworkingMacros: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Networking: PASS" >> $GITHUB_STEP_SUMMARY
