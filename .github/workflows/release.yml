name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag, such as 2.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: ref
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          component='(0|[1-9][0-9]*)'
          stable_tag="^${component}[.]${component}[.]${component}$"
          if ! [[ "$TAG" =~ $stable_tag ]]; then
            echo 'Expected a stable MAJOR.MINOR.PATCH tag' \
              'without a v prefix.' >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            checkout="$GITHUB_SHA"
          else
            checkout="refs/tags/$TAG"
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'checkout=%s\n' "$checkout" >> "$GITHUB_OUTPUT"

      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.ref.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26.6
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          swift --version
          xcodebuild -version

      - name: Fetch and verify release tag
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          tagged_commit="$(git rev-list -n 1 "refs/tags/$TAG")"
          checked_out_commit="$(git show -s --format=%H HEAD)"
          if [[ "$tagged_commit" != "$checked_out_commit" ]]; then
            echo "Tag $TAG does not point to the checked-out commit." >&2
            exit 1
          fi

      - name: Build and test NetworkingMacros
        shell: bash
        run: |
          set -euo pipefail
          swift build \
            --package-path Packages/NetworkingMacros \
            -j 1 \
            -Xswiftc -warnings-as-errors
          swift test --package-path Packages/NetworkingMacros -j 1

      - name: Build and test Networking
        shell: bash
        run: |
          set -euo pipefail
          swift build \
            --package-path Packages/Networking \
            -j 1 \
            -Xswiftc -warnings-as-errors
          swift test --package-path Packages/Networking -j 1

      - name: Test package consumers
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Fixtures/NetworkingConsumer -j 1
          swift test --package-path Fixtures/ExtensionConsumer -j 1

      - name: Test binary release scripts
        shell: bash
        run: python3 -m unittest discover -s Tests/BinaryReleaseTests -v

      - name: Build binary release assets
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-binary-xcframeworks.sh \
            "$TAG" \
            "$RUNNER_TEMP/networking-binary-release" \
            "$GITHUB_REPOSITORY"

      - name: Publish source and binary release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/networking-binary-release
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG"
          tag_refs="$(git ls-remote --tags origin "$tag_ref" "$tag_ref^{}")"
          tagged_commit="$(awk -v ref="$tag_ref" '
            $2 == ref { direct = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print peeled ? peeled : direct }
          ' <<< "$tag_refs")"
          if [[ "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag $TAG no longer points to the validated commit." >&2
            exit 1
          fi

          if existing_release="$(gh release view "$TAG" --json isDraft \
            --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$existing_release" != true ]]; then
              echo "Refusing to modify published release assets for $TAG." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --draft
          fi

          gh release upload "$TAG" \
            "$ARTIFACT_DIRECTORY/NetworkingCore.xcframework.zip" \
            "$ARTIFACT_DIRECTORY/NetworkingRuntime.xcframework.zip" \
            "$ARTIFACT_DIRECTORY/NetworkingObservability.xcframework.zip" \
            "$ARTIFACT_DIRECTORY/NetworkingSSE.xcframework.zip" \
            "$ARTIFACT_DIRECTORY/Networking.xcframework.zip" \
            "$ARTIFACT_DIRECTORY/Package.binary.swift"
          gh release edit "$TAG" --draft=false
