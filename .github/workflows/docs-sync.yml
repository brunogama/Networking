name: Documentation Sync

on:
  push:
    branches: [main, dev]
    paths:
      - 'Sources/**/*.swift'
      - 'Packages/**/Sources/**/*.swift'
      - '.github/workflows/docs-sync.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'Sources/**/*.swift'
      - 'Packages/**/Sources/**/*.swift'
      - '.github/workflows/docs-sync.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regenerate all documentation'
        required: false
        default: 'false'
        type: boolean
      create_issue:
        description: 'Create GitHub issue for detected APIs'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-api-changes:
    name: Detect API Changes
    runs-on: macos-15
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
      new_count: ${{ steps.diff.outputs.new_count }}
      new_symbols: ${{ steps.diff.outputs.new_symbols }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install jq
        run: brew install jq

      - name: Select Baseline Commit
        id: baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            base_sha=$(git rev-parse HEAD^)
          fi
          git cat-file -e "$base_sha^{commit}"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Generate Symbol Graphs
        run: |
          set -euo pipefail
          mkdir -p .cache

          extract_symbols() {
            local source_path="$1"
            local scratch_path="$2"
            local graph_path="$3"
            local output_path="$4"
            mkdir -p "$graph_path"
            swift build --package-path "$source_path" --scratch-path "$scratch_path" \
              -Xswiftc -emit-symbol-graph \
              -Xswiftc -emit-symbol-graph-dir -Xswiftc "$graph_path"

            shopt -s nullglob
            local graphs=("$graph_path"/Networking*.symbols.json)
            if [ "${#graphs[@]}" -eq 0 ]; then
              echo "No Networking symbol graphs were generated" >&2
              exit 1
            fi
            for symfile in "${graphs[@]}"; do
              pkg=$(basename "$symfile" .symbols.json)
              jq -c --arg pkg "$pkg" '[
                .symbols[]? |
                select(.accessLevel == "public" or .accessLevel == "open") |
                select(.identifier.precise | contains("SYNTHESIZED") | not) |
                {
                  package: $pkg,
                  name: .names.title,
                  kind: .kind.identifier,
                  precise: .identifier.precise
                }
              ]' "$symfile"
            done | jq -s 'add // []' > "$output_path"
          }

          base_path="$RUNNER_TEMP/api-baseline-source"
          git worktree add --detach "$base_path" "${{ steps.baseline.outputs.sha }}"
          extract_symbols "$base_path" "$RUNNER_TEMP/api-baseline-build" \
            "$RUNNER_TEMP/api-baseline-graphs" "$GITHUB_WORKSPACE/.cache/api-baseline.json"
          git worktree remove --force "$base_path"
          rm -rf "$RUNNER_TEMP/api-baseline-build" "$RUNNER_TEMP/api-baseline-graphs"

          extract_symbols "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.build" \
            "$GITHUB_WORKSPACE/.build/symbol-graphs" "$GITHUB_WORKSPACE/.cache/current-symbols.json"

      - name: Extract and Compare Symbols
        id: diff
        run: |
          set -euo pipefail
          NEW_COUNT=$(jq 'length' .cache/current-symbols.json)
          echo "Total public symbols across all packages: $NEW_COUNT"

          # Get precise identifiers from both commits
          jq -r '.[].precise' .cache/current-symbols.json | sort -u > "$RUNNER_TEMP/current.txt"
          jq -r '.[].precise' .cache/api-baseline.json | sort -u > "$RUNNER_TEMP/baseline.txt"

          # Find new symbols
          NEW_PRECISES=$(comm -23 "$RUNNER_TEMP/current.txt" "$RUNNER_TEMP/baseline.txt")
          NEW_SYMBOL_COUNT=$(printf '%s\n' "$NEW_PRECISES" | grep -c . || true)

          if [ "$NEW_SYMBOL_COUNT" -gt 0 ]; then
            # Get details of new symbols
            NEW_DETAILS=$(jq -c --argjson precises "$(printf '%s\n' "$NEW_PRECISES" | jq -R . | jq -s .)" \
              '[.[] | select(.precise as $p | $precises | index($p))] | unique_by(.precise)' .cache/current-symbols.json)
            {
              echo "has_changes=true"
              echo "new_count=$NEW_SYMBOL_COUNT"
              echo "new_symbols<<EOF"
              printf '%s\n' "$NEW_DETAILS" | jq -r '.[] | "- \(.kind): \(.name)"'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_changes=false"
              echo "new_count=0"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        env:
          HAS_CHANGES: ${{ steps.diff.outputs.has_changes }}
          NEW_COUNT: ${{ steps.diff.outputs.new_count }}
          NEW_SYMBOLS: ${{ steps.diff.outputs.new_symbols }}
        run: |
          {
            echo "## API Change Detection"
            echo ""
            if [ "$HAS_CHANGES" = "true" ]; then
              echo "**New APIs detected:** $NEW_COUNT"
              echo ""
              echo "### New Symbols"
              echo '```'
              printf '%s\n' "$NEW_SYMBOLS"
              echo '```'
            else
              echo "No new public APIs detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify-docs-needed:
    name: Documentation Notice
    needs: detect-api-changes
    if: |
      needs.detect-api-changes.outputs.has_changes == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          NEW_COUNT: ${{ needs.detect-api-changes.outputs.new_count }}
          NEW_SYMBOLS: ${{ needs.detect-api-changes.outputs.new_symbols }}
        with:
          script: |
            const newCount = process.env.NEW_COUNT;
            const newSymbols = process.env.NEW_SYMBOLS;

            const body = `## Documentation Required

            This PR introduces **${newCount} new public API(s)** that need documentation.

            ### New Symbols
            \`\`\`
            ${newSymbols}
            \`\`\`

            Please ensure Documentation.docc is updated with:
            - Extension files for new types (\`Documentation.docc/Extensions/<TypeName>.md\`)
            - Updated topic groups in \`Documentation.docc/Networking.md\`

            Run \`/docs-sync\` locally to auto-generate documentation.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  create-doc-issues:
    name: Create Documentation Issues
    needs: detect-api-changes
    if: |
      needs.detect-api-changes.outputs.has_changes == 'true' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_issue == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Documentation Issue
        id: create-doc-issues
        uses: actions/github-script@v7
        env:
          NEW_COUNT: ${{ needs.detect-api-changes.outputs.new_count }}
          NEW_SYMBOLS: ${{ needs.detect-api-changes.outputs.new_symbols }}
        with:
          script: |
            const newCount = process.env.NEW_COUNT;
            const newSymbols = process.env.NEW_SYMBOLS;
            const sha = context.sha.substring(0, 7);
            const date = new Date().toISOString().split('T')[0];

            // Parse symbols to categorize by type
            const symbolLines = newSymbols.trim().split('\n').filter(l => l.startsWith('-'));
            const structs = symbolLines.filter(l => l.includes('swift.struct'));
            const protocols = symbolLines.filter(l => l.includes('swift.protocol'));
            const enums = symbolLines.filter(l => l.includes('swift.enum'));
            const funcs = symbolLines.filter(l => l.includes('swift.func') || l.includes('swift.method'));

            // Build issue body with task checklist
            let body = `## Documentation Task

            **Commit:** ${sha}
            **Date:** ${date}
            **New APIs:** ${newCount}

            ### Symbols Requiring Documentation

            \`\`\`
            ${newSymbols}
            \`\`\`

            ### Tasks

            #### Extension Files (Documentation.docc/Extensions/)
            `;

            // Add checklist for types
            const types = [...structs, ...protocols, ...enums];
            if (types.length > 0) {
              types.forEach(t => {
                const name = t.split(':').pop()?.trim().split(' ')[0] || 'Unknown';
                body += `- [ ] Create \`${name}.md\` extension file\n`;
              });
            } else {
              body += `- [ ] No new types requiring extension files\n`;
            }

            body += `
            #### Tutorial Updates
            - [ ] Update \`Documentation.docc/Networking.md\` topic groups
            - [ ] Add code examples for new APIs
            - [ ] Cross-reference related documentation

            #### Validation
            - [ ] Run \`swift package generate-documentation\` to verify
            - [ ] Check all symbol links resolve correctly
            - [ ] Review generated HTML output

            ### How to Complete

            1. Run \`/docs-sync\` to auto-generate initial documentation
            2. Review and enhance generated content
            3. Add code examples and usage guidance
            4. Submit PR with documentation updates

            ---
            *Auto-generated by docs-sync workflow*`;

            // Check for existing open issue to avoid duplicates
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'documentation,auto-generated',
              state: 'open'
            });

            // Create issue if no recent one exists (within 24h with same count)
            const recentIssue = existingIssues.data.find(issue => {
              const created = new Date(issue.created_at);
              const now = new Date();
              const hoursDiff = (now - created) / (1000 * 60 * 60);
              return hoursDiff < 24 && issue.title.includes(`${newCount} new`);
            });

            if (!recentIssue) {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `docs: Document ${newCount} new public API(s) from ${sha}`,
                body: body,
                labels: ['documentation', 'auto-generated', 'good first issue']
              });

              console.log(`Created issue #${issue.data.number}`);
              core.setOutput('issue_number', issue.data.number);
            } else {
              console.log(`Skipped - recent issue exists: #${recentIssue.number}`);
              core.setOutput('issue_number', recentIssue.number);
            }

      - name: Link Issue to Commit
        if: steps.create-doc-issues.outputs.issue_number
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.create-doc-issues.outputs.issue_number }}
        with:
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            if (issueNumber) {
              // Add commit reference comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: `Triggered by commit ${context.sha}`
              });
            }
