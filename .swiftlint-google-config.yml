# SwiftLint Configuration - Google Swift Style Guide Compliance
# Based on: https://google.github.io/swift/

# Opt-in rules that align with Google Swift Style Guide
opt_in_rules:
  - array_init
  - closure_body_length
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - conditional_returns_on_newline
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_optional_collection
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - function_default_parameter_at_end
  - ibinspectable_in_extension
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - let_var_whitespace
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nimble_operator
  - no_space_in_method_call
  - number_separator
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strict_fileprivate
  - switch_case_on_newline
  - toggle_bool
  - trailing_closure
  - type_contents_order
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_declaration
  - unused_import
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

# Excluded paths
excluded:
  - Carthage
  - Pods
  - .build
  - Benchmarks

# Google Swift Style Guide: Line length 100 characters
line_length:
  warning: 100
  error: 110

# Google Swift Style Guide: File organization and size
file_length:
  warning: 200
  error: 250

# Google Swift Style Guide: Function complexity
function_body_length:
  warning: 40
  error: 50

# Google Swift Style Guide: Type complexity
type_body_length:
  warning: 200
  error: 250

# Google Swift Style Guide: Cyclomatic complexity
cyclomatic_complexity:
  warning: 10
  error: 15

# Google Swift Style Guide: Function parameter count (recommended max 4)
function_parameter_count:
  warning: 4
  error: 6

# Google Swift Style Guide: Nesting levels
nesting:
  type_level:
    warning: 2
    error: 3
  statement_level:
    warning: 5
    error: 10

# Google Swift Style Guide: Identifier naming
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - URL
    - URI
    - UUID
    - API

# Google Swift Style Guide: Type naming
type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

# Custom rules for Google Swift Style Guide compliance
custom_rules:
  google_copyright_header:
    name: "Google Copyright Header"
    regex: "^//\\s*Copyright \\d{4}"
    message: "Files should start with a copyright header"
    severity: warning

  google_import_order:
    name: "Import Order"
    regex: "import\\s+(?!Foundation)\\w+\\n\\s*import\\s+Foundation"
    message: "Foundation imports should come first"
    severity: warning

  google_documentation_style:
    name: "Documentation Style"
    regex: "///\\s*[a-z]"
    message: "Documentation comments should start with capital letter"
    severity: warning

# Baseline configuration for existing violations
baseline: .swiftlint-baseline.yml

# Reporter configuration
reporter: "xcode"

# Strict mode for CI/CD
strict: true
