# Pre-commit hooks configuration
# Install with: pip install pre-commit && pre-commit install

default_install_hook_types:
- pre-commit
default_stages:
- pre-commit
repos:
- repo: local
  hooks:
  - id: swift-beautifier
    name: ✨ Formatting Swift code...
    entry: swift-format -i --configuration .swift-format
    language: system
    files: \.swift$
    pass_filenames: true
    stages:
    - commit-msg
  - id: swift-sheriff
    name: 🤠 Linting Swift code...
    entry: bash -c 'swiftlint --config .swiftlint.yml --fix -- "$@"'
    language: system
    files: \.swift$
    pass_filenames: true
    stages:
    - pre-commit
  - id: swift-package-tests
    name: 🧪 Testing affected packages...
    entry: ./scripts/test-affected-packages.sh
    language: system
    pass_filenames: false
    always_run: false
    files: \.swift$
    stages:
    - pre-merge-commit
    - pre-push
  - id: swift-warning-guard
    name: ⚠️ Checking for Swift warnings...
    entry: bash -c 'if git diff --cached --name-only | grep -q "\.swift$"; then echo
      "🔍 Compiling workspace with warnings as errors..."; for pkg in MacroTemplateKit
      NetworkingMacros Networking; do if git
      diff --cached --name-only | grep -q "Packages/$pkg/"; then echo "Building $pkg...";
      swift build --package-path "Packages/$pkg" -Xswiftc -warnings-as-errors || exit
      1; fi; done; fi'
    language: system
    pass_filenames: false
    always_run: false
    files: \.swift$
    stages:
    - pre-merge-commit
    - pre-push
  - id: branch-guardian
    name: 🚫 Checking branch protection...
    entry: bash -c 'BRANCH=$(git rev-parse --abbrev-ref HEAD); if [ "$BRANCH" = "main"
      ] || [ "$BRANCH" = "dev" ]; then echo "🛑 Direct commits to $BRANCH branch are
      not allowed! Use feature branches and PRs instead 🚀"; exit 1; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages:
    - pre-merge-commit
    - pre-push
  - id: license-year-updater
    name: 📅 Updating LICENSE year...
    entry: bash -c \'if [ -f "LICENSE" ]; then CURRENT_YEAR=$(date +"%Y"); sed -i
      "" "s/Copyright (c) [0-9]\\{4\\}/Copyright (c) $CURRENT_YEAR/" LICENSE; fi\'
    language: system
    files: ^LICENSE$
    pass_filenames: false
    always_run: true
    stages:
    - pre-merge-commit
    - pre-push
  - id: changelog-enforcer
    name: 📝 Checking CHANGELOG updates...
    entry: bash -c 'if [ -f "CHANGELOG.md" ] && git diff --cached --name-only | grep
      -v "CHANGELOG.md" | grep -q "\."; then if ! git diff --cached --name-only |
      grep -q "CHANGELOG.md"; then echo "🛑 Changes detected but CHANGELOG.md was not
      updated! Please update the changelog."; exit 1; fi; fi'
    language: system
    pass_filenames: false
    always_run: true
    exclude: ^(\.pre-commit-config\.yaml|\.gitignore|CHANGELOG\.md)$
    stages:
    - pre-merge-commit
    - pre-push
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    name: 🧹 Removing trailing whitespace...
    exclude: \.md$
    stages:
    - commit-msg
  - id: end-of-file-fixer
    name: 📝 Adding final newlines...
    stages:
    - commit-msg
  - id: check-yaml
    name: 🔍 Checking YAML syntax...
    stages:
    - commit-msg
  - id: check-added-large-files
    name: 📏 Checking file sizes...
    args:
    - --maxkb=1000
    stages:
    - commit-msg
  - id: check-merge-conflict
    name: ⚔️ Checking for merge conflicts...
    stages:
    - commit-msg
  - id: check-case-conflict
    name: 🔤 Checking filename case conflicts...
    stages:
    - commit-msg
  - id: mixed-line-ending
    name: 📐 Fixing line endings...
    args:
    - --fix=lf
    stages:
    - commit-msg
fail_fast: true
