# Managed by provision-swift-quality.sh. Works with prek and pre-commit.
#
#   pre-commit: format staged Swift files only (fast, no lint). If the formatter
#               changes anything, the commit stops so you can review and re-add.
#   pre-push:   strict format + SwiftLint check of the Swift files being pushed.
#   CI:         authoritative full-scope gate (.github/workflows/swift-quality.yml).
#
# Install once per clone:  prek install

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift format (staged Swift files)
        language: system
        entry: bash scripts/swift-style format
        files: ^(Sources|Benchmarks|Tests|Packages/[^/]+/(Sources|Tests))/
        types: [swift]
        stages: [pre-commit]
        require_serial: true

      - id: swift-style
        name: swift-style check (format + SwiftLint, strict)
        language: system
        entry: bash scripts/swift-style check
        files: ^(Sources|Benchmarks|Tests|Packages/[^/]+/(Sources|Tests))/
        types: [swift]
        stages: [pre-push, manual]
        require_serial: true
